<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectator's Sources</title>
    <link rel = "stylesheet" href="styles.css"> 
</head>
<body class="ALL">
    <div class="SpectatorImage">
        <img src="https://clubs-cu.s3.amazonaws.com/Spectator+Publishing+Logo.png" alt="Columbia Spectator Logo" width="263" height="55">
    </div>
    <div class = "SpectatorTitle"> 
        <h1>Spectator's Sources</h1>
    </div>
    <div class = "AddSource">
        <div class="SourceText"> 
            <label for="Source Name: ">Source Name: </label>
            <input type="text">
        </div>
        <div class = "SourceText">
            <label for="Source Email: ">Source Email: </label>

        </div>
        <div>
            <button class = "ADD" type="button">ADD</button>
        </div> 
    </div>
    <div>
        <ul class = "OBox">
            <li> 
                <span class = "Num">1</span>
                <span class="Name">Presbo</span>
                <span class = "Email">presbo@columbia.edu</span>
                <button class = "Delete" type="button">DELETE</button>
            </li>
            <li>
                <span class = "Num">2</span>
                <span class="Name">John Jay Mouse</span>
                <span class = "Email">mouse@columbia.edu</span>
                <button class = "Delete" type="button">DELETE</button>
            </li>
            <li>
                <span class = "Num">3</span>
                <span class="Name">Water Bottle Man</span>
                <span class = "Email">flipper@columbia.edu</span>
                <button class = "Delete" type="button">DELETE</button>
            </li>
        </ul>
    </div>
</body>
</html>
